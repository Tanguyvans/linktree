<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@code_simple | Links</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@300;400;600&display=swap');

        :root {
            --clr-sun: #f5c842;
            --clr-sky: #4a90c4;
            --clr-coral: #ff6b6b;
            --clr-peach: #ffb088;
            --clr-lavender: #b8a9e8;
            --clr-deep: #1a1032;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            background: var(--clr-deep);
        }

        /* ── Animated mesh gradient background ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse 600px 600px at 20% 30%, var(--clr-sky) 0%, transparent 60%),
                radial-gradient(ellipse 500px 500px at 75% 20%, var(--clr-lavender) 0%, transparent 55%),
                radial-gradient(ellipse 700px 700px at 60% 70%, var(--clr-coral) 0%, transparent 50%),
                radial-gradient(ellipse 400px 400px at 30% 80%, var(--clr-sun) 0%, transparent 55%),
                radial-gradient(ellipse 500px 500px at 85% 60%, var(--clr-peach) 0%, transparent 50%);
            animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            33%  { transform: translate(-30px, 20px) rotate(3deg) scale(1.02); }
            66%  { transform: translate(20px, -15px) rotate(-2deg) scale(0.98); }
            100% { transform: translate(-10px, 25px) rotate(1deg) scale(1.01); }
        }

        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 8, 30, 0.45);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
        }

        .orb--1 {
            width: 300px; height: 300px;
            background: var(--clr-sun);
            top: -80px; right: -60px;
            animation: float1 8s ease-in-out infinite;
        }

        .orb--2 {
            width: 200px; height: 200px;
            background: var(--clr-sky);
            bottom: -40px; left: -40px;
            animation: float2 10s ease-in-out infinite;
        }

        .orb--3 {
            width: 150px; height: 150px;
            background: var(--clr-coral);
            top: 40%; left: 60%;
            animation: float3 7s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, 30px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(25px, -20px); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-15px, 15px) scale(1.1); }
        }

        /* ── Grain overlay ── */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 180px;
        }

        /* ── Main container ── */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 48px 24px 40px;
            text-align: center;
        }

        /* ── Profile ── */
        .profile {
            animation: fadeUp 0.8s ease both;
        }

        .profile-ring {
            display: inline-block;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--clr-sun), var(--clr-coral), var(--clr-lavender), var(--clr-sky));
            background-size: 300% 300%;
            animation: ringShift 6s ease infinite;
            margin-bottom: 20px;
        }

        @keyframes ringShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid var(--clr-deep);
        }

        .name {
            font-family: 'Sora', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 30%, var(--clr-sun));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bio {
            font-size: 0.9rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        /* ── Link buttons ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 22px;
            border-radius: var(--radius);
            text-decoration: none;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .link-btn:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .link-btn:active {
            transform: scale(0.97);
        }

        .link-btn svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        .link-btn .arrow {
            margin-left: auto;
            width: 18px;
            height: 18px;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
        }

        .link-btn:hover .arrow {
            opacity: 0.8;
            transform: translateX(3px);
        }

        /* Instagram */
        .link-instagram {
            background: linear-gradient(135deg,
                rgba(131, 58, 180, 0.35),
                rgba(253, 29, 29, 0.25),
                rgba(252, 176, 69, 0.2));
            box-shadow: 0 4px 24px rgba(253, 29, 29, 0.15);
            animation: fadeUp 0.8s ease both;
            animation-delay: 0.15s;
        }

        .link-instagram:hover {
            box-shadow: 0 8px 32px rgba(253, 29, 29, 0.3);
        }

        /* TikTok */
        .link-tiktok {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.8s ease both;
            animation-delay: 0.3s;
        }

        .link-tiktok:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        .tiktok-glow {
            position: relative;
        }

        .tiktok-glow::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #25f4ee, #fe2c55);
            border-radius: 4px;
            filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .link-tiktok:hover .tiktok-glow::after {
            opacity: 0.5;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 48px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: fadeUp 0.8s ease both;
            animation-delay: 0.45s;
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .container { padding: 36px 18px 32px; }
            .profile-pic { width: 100px; height: 100px; }
            .name { font-size: 1.4rem; }
            .link-btn { padding: 14px 18px; font-size: 0.95rem; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background layers -->
    <div class="bg"></div>
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="grain"></div>

    <div class="container">
        <!-- Profile -->
        <div class="profile">
            <div class="profile-ring">
                <img class="profile-pic" src="profile.png" alt="@iamtguy" />
            </div>
            <h1 class="name">@code_simple</h1>
            <p class="bio">Actu IA &amp; tutos dev — tous les jours</p>
        </div>

        <!-- Links -->
        <div class="links">

            <a href="https://www.tiktok.com/@code_simple" target="_blank" rel="noopener" class="link-btn link-tiktok">
                <span class="tiktok-glow">

                </span>
                TikTok
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>

            </a>
        </div>

        <p class="footer">code_simple</p>
    </div>
</body>
