<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@code_simple | Liens et ressources</title>
    <meta name="description" content="Les réseaux de Code Simple et les ressources des vidéos : guides, prompts et projets à refaire.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        /* même papier que les guides et la cheatsheet Claude Code */
        :root {
            --paper: #faf8f5;
            --ink: #2a2520;
            --ink-soft: #5e4f3d;
            --ink-faint: #9c8568;
            --orange: #e07c3e;
            --highlight: #ffe08a;
            --sticky: #fef4a8;
            --hand: 'Caveat', cursive;
            --body: 'Space Grotesk', system-ui, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--body);
            background: var(--paper);
            color: var(--ink);
            line-height: 1.5;
        }
        ::selection { background: var(--orange); color: #fff; }
        a { color: inherit; text-decoration: none; }

        .wrap { max-width: 460px; margin: 0 auto; padding: 40px 16px 48px; }

        .sketch {
            border: 1.5px solid var(--ink);
            border-radius: 8px 5px 9px 4px / 4px 8px 5px 9px;
            background: #fff;
        }
        .highlight {
            background: linear-gradient(180deg, transparent 45%, var(--highlight) 45%, var(--highlight) 90%, transparent 90%);
            padding: 0 2px;
        }

        /* profil */
        .profile { text-align: center; }
        .profile-pic {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            transform: rotate(-3deg);
        }
        .name {
            font-family: var(--hand);
            font-weight: 700;
            font-size: 42px;
            line-height: 1.1;
            margin-top: 14px;
        }
        .bio { color: var(--ink-soft); font-size: 15px; margin-top: 4px; }

        /* réseaux */
        .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
        .social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            font-weight: 600;
            transition: transform .15s, box-shadow .15s;
        }
        .social svg { width: 22px; height: 22px; flex: none; }

        /* ressources */
        .section { font-family: var(--hand); font-weight: 700; font-size: 32px; line-height: 1; margin: 40px 0 14px; }

        .resource {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 14px;
            padding: 16px;
            border-width: 2.5px;
            transition: transform .15s, box-shadow .15s;
        }
        .doc { width: 64px; height: 80px; transform: rotate(-4deg); }
        .tag {
            display: inline-block;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            border: 1.5px solid var(--ink-faint);
            border-radius: 4px;
            padding: 1px 6px;
        }
        .resource h3 { font-size: 19px; font-weight: 700; line-height: 1.25; margin: 6px 0 4px; }
        .resource p { color: var(--ink-soft); font-size: 14.5px; }
        .resource .open {
            display: inline-block;
            margin-top: 10px;
            font-family: var(--hand);
            font-weight: 700;
            font-size: 22px;
            color: var(--orange);
        }

        .social:hover, .resource:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
        .social:active, .resource:active { transform: none; box-shadow: none; }
        .social:focus-visible, .resource:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

        .footer { margin-top: 40px; text-align: center; color: var(--ink-faint); font-size: 13px; }

        @media (prefers-reduced-motion: reduce) {
            .social, .resource { transition: none; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="profile">
            <img class="profile-pic" src="profile.png" alt="@code_simple" width="108" height="108">
            <h1 class="name"><span class="highlight">@code_simple</span></h1>
            <p class="bio">Actu IA et tutos dev, tous les jours</p>
        </div>

        <nav class="socials" aria-label="Réseaux">
            <a class="social sketch" href="https://www.instagram.com/iamtguy/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>
                </svg>
                Instagram
            </a>
            <a class="social sketch" href="https://www.tiktok.com/@code_simple" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.34-6.34V9.17a8.16 8.16 0 004.76 1.52v-3.4a4.85 4.85 0 01-1-.6z"/>
                </svg>
                TikTok
            </a>
        </nav>

        <h2 class="section">Ressources des vidéos</h2>

        <a class="resource sketch" href="guides/youtube-sans-clickbait.html">
            <!-- une feuille au coin plié -->
            <svg class="doc" viewBox="0 0 64 80" aria-hidden="true">
                <path d="M4 3h40l17 17v56H4z" fill="#fef4a8" stroke="#2a2520" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M44 3v17h17" fill="none" stroke="#2a2520" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M13 34h38M13 44h38M13 54h26" stroke="#2a2520" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M13 64h16" stroke="#e07c3e" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div>
                <span class="tag">Guide · Prompt</span>
                <h3>YouTube sans clickbait</h3>
                <p>L'extension Chrome prête à installer, et les prompts pour la refaire ou créer ton propre algorithme.</p>
                <span class="open">Ouvrir la ressource →</span>
            </div>
        </a>

        <p class="footer">Code Simple</p>
    </main>
</body>
</html>
